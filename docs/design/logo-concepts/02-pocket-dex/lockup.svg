  <title id="t">วีไทยเด็กซ์ — บัตรสารบบพกพา พร้อมชื่อแบรนด์</title>
  <desc id="d">บัตรมุมมนพร้อมแท็บและช่องว่างรูปตัววี สื่อถึงสารบบที่ค้นหาได้ง่ายและเปิดพื้นที่ให้ครีเอเตอร์ทุกคน ชื่อ VThaiDex วาดด้วยเส้นพาธทุกตัวอักษร ไม่มีการพึ่งพาฟอนต์</desc>
